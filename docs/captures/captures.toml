titre = { fr = "Les plugins installés", en = "Installed plugins" }
alt = { fr = "Le tableau des plugins installés : état de la source git (gérée, déclarée, sans source), dépôt, référence, fournisseur et actions", en = "The installed plugins table: git source state (managed, declared, no source), repository, reference, provider and actions" }

