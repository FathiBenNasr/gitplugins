# Manifeste des captures de Git Plugin Installer.
# Une entrée [[capture]] par image de ce dossier. Lu par audit_doc.py, et plus tard par
# l'assembleur du manuel. Les captures 01 à 05 viennent de capture.js, les 06 à 09 du script
# de manuel du banc ; ni les unes ni les autres ne sont prises à la main.

[[capture]]
id = "greffon"
fichier = "01-plugin.png"
document = "docs/ADMINISTRATION.md#installation"
variante = "clair"
commande = "podman exec -e GLPI_URL -e GLPI_USER -e GLPI_PASS -e OUT puppeteer-test node /app/scripts/gitplugins/capture.js"
titre = { fr = "Git Plugin Installer dans la liste des greffons", en = "Git Plugin Installer in the plugin list" }
alt = { fr = "La tuile de Git Plugin Installer dans Configuration, Plugins, avec son logo, sa licence et sa version", en = "The Git Plugin Installer tile in Setup, Plugins, with its logo, licence and version" }

